[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aneeq-website-scraper"
version = "0.1.0"
description = "A command-line website scraper with SQLite persistence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aneeq" }]
dependencies = []

[project.scripts]
website-scraper = "website_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["website_scraper*"]
