<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102a43" />
    <title>Aneeq Medical Study</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand">
          <span class="brand-mark">A</span>
          <div>
            <strong>Aneeq Medical</strong>
            <span>Offline QBank + Tutor</span>
          </div>
        </div>

        <nav class="nav-list">
          <button class="nav-link active" data-route="dashboard">Dashboard</button>
          <button class="nav-link" data-route="qbank">QBank</button>
          <button class="nav-link" data-route="test">Create Test</button>
          <button class="nav-link" data-route="search">Search</button>
          <button class="nav-link" data-route="favorites">Favorites</button>
          <button class="nav-link" data-route="books">Books</button>
          <button class="nav-link" data-route="downloads">Downloads</button>
          <button class="nav-link" data-route="settings">Settings</button>
        </nav>

        <div class="sync-card">
          <span class="status-dot"></span>
          <div>
            <strong>Offline-ready</strong>
            <p id="sync-status">Local changes sync when online.</p>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Medical board prep</p>
            <h1 id="page-title">Dashboard</h1>
          </div>
          <div class="topbar-actions">
            <label class="language-picker">
              Translate
              <select id="language-select" aria-label="Translation language"></select>
            </label>
            <button id="install-button" class="ghost hidden">Install app</button>
          </div>
        </header>

        <section id="app" class="content" aria-live="polite"></section>
      </main>
    </div>

    <template id="empty-state-template">
      <div class="empty-state">
        <h3>No results yet</h3>
        <p>Try changing your filters or adding downloaded content.</p>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
